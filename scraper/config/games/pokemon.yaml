# Pokémon – welche Produkte erfasst werden.
# Ein weiteres Spiel (z. B. One Piece) = eine weitere Datei in diesem Ordner nach demselben Muster.
# Änderungen wirken ab dem nächsten Lauf; der Katalog wird dabei komplett neu bewertet.

game:
  key: pokemon              # interner Schlüssel, bestimmt die Ordner in R2 (catalog/pokemon/…)
  name: Pokémon
  cardmarket_id: 6          # Spiel-ID in den Cardmarket-Downloads (products_nonsingles_6.json)
  cardmarket_path: Pokemon  # Teil der Website-Adresse: cardmarket.com/de/Pokemon/…

# Kategorien laut Cardmarket-Katalog (idCategory). Nur diese Produkte sind "im Scope".
# slug = Teil der Produkt-URL auf der Website (…/Products/<slug>/<Produktname>).
# Reihenfolge = Reihenfolge beim Scrapen.
categories:
  - id: 53
    name: Pokémon Display              # Website: "Booster Displays" (Booster Boxes, Cases, Bundles)
    slug: Booster-Boxes
  - id: 1016
    name: Pokémon Elite Trainer Boxes  # inkl. Pokémon-Center-ETBs und ETB-Cases
    slug: Elite-Trainer-Boxes
  - id: 1015
    name: Pokémon Box Set              # Collections, UPCs, Build & Battle usw.
    slug: Box-Sets
  - id: 1014
    name: Pokémon Tins                 # inkl. Mini Tin Displays
    slug: Tins
  - id: 1083
    name: Pokémon Blisters
    slug: Blisters

# Sprachen, die pro Produkt gescrapt werden – jeweils nur, wenn Cardmarket sie für das Produkt führt.
# Mögliche Werte: en, fr, de, es, it, zh, ja, pt, ru, ko
languages: [en, de, ja]

# Anzahl der günstigsten Angebote, die pro Variante einzeln gespeichert werden – jeweils nach
# Endpreis (inkl. Versand) und nach Artikelpreis. Für die Bestandszählung zählen immer alle Angebote.
offers_to_store: 50

# Ausschlüsse innerhalb der Kategorien.
exclude:
  # Reguläre Ausdrücke auf den Produktnamen, Groß-/Kleinschreibung egal.
  name_patterns:
    # Chinesische Produkte (Stand 05.11.2026: 193 Produkte in den Scope-Kategorien)
    - 'S-Ch'                    # "Black Bolt S-Ch Booster Box"
    - '\bT-Ch\b'
    - 'Chinese'                 # "Simplified/Traditional Chinese …", "Chinese Happy Set …"
    - '(?-i:^(CS|CBB)[A-Za-z0-9.]*C:|^\d+C:)'   # Set-Codes wie "CSV10.6C:", "CBB7C:", "151C:"
  # Weitere Beispiele:
  #   - 'Pencil Case'    # Federmäppchen
  # Einzelne Cardmarket-Produkt-IDs.
  product_ids: []

# Sicherheitsprüfung: Hat ein neuer Katalog deutlich weniger Produkte als der letzte,
# bricht der Lauf ab statt kaputte Daten zu speichern.
validation:
  min_products_ratio: 0.9
