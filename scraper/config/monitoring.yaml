# Schwellen für die tägliche Plausibilitätsprüfung (läuft, sobald ein Tag vollständig gescrapt ist).
# Wird eine Schwelle überschritten, kommt eine Mail. Schlägt eine Prüfung grundlos an: Zahl hier anpassen.
# Anteile als Dezimalzahl: 0.05 = 5 %.

daily_report: true                  # nach jedem vollständigen Tag eine Bericht-Mail, auch wenn alles ok ist

scrape:
  error_variants_max: 0.02          # Varianten mit Abruf-/Lesefehler oder "nicht gefunden"
  shipping_missing_max: 0.05        # Angebote ohne Versandkosten (Hinweis auf verlorenen Login)
  field_fill_min: 0.95              # Mindest-Füllquote für Land, Bewertung, Verkaufsanzahl, Infobox-Werte
  professional_share_min: 0.05      # Mindestanteil gewerblicher Verkäufer (sonst wird der Typ nicht gelesen)
  wrong_language_max: 0.02          # Angebote in einer anderen Sprache als der Variante (Sprachfilter kaputt)
  incomplete_counts_max: 0.02       # Varianten mit "nicht vollständig gezählt"
  flaresolverr_share_max: 0.10      # Abrufe, die FlareSolverr statt des Direktabrufs brauchten (Sperr-Frühwarnung)

catalog:
  price_guide_stale_days: 2         # so viele Tage in Folge derselbe Price-Guide-Stand
  active_drop_max: 0.10             # Rückgang der aktiven Produkte gegenüber dem letzten Lauf

storage:
  warn_gb: 8.0                      # 80 % des kostenlosen R2-Kontingents (10 GB); Prüfung sonntags
