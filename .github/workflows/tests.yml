name: Tests

on:
  pull_request:
    paths: ["scraper/**", "server/**", ".github/workflows/tests.yml"]
  push:
    branches: [main]
    paths: ["scraper/**", "server/**", ".github/workflows/tests.yml"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: pip install shellcheck-py
      - run: shellcheck -S warning server/*.sh server/cm
