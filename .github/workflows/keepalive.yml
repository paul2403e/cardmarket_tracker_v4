name: Zeitpläne aktiv halten

# GitHub deaktiviert geplante Workflows in öffentlichen Repos nach 60 Tagen ohne Aktivität im Repo.
# Dieser Workflow aktiviert sie monatlich neu (ohne Commits). Fällt alles aus, meldet sich healthchecks.io.

on:
  schedule:
    - cron: "23 5 1 * *"   # am 1. jedes Monats
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Geplante Workflows aktivieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in catalog.yml scrape.yml keepalive.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" && echo "✅ $wf aktiv"
          done
