name: Katalog & Price Guide

on:
  schedule:
    # Täglich 03:41 UTC = 04:41 Uhr (Winterzeit) bzw. 05:41 Uhr (Sommerzeit) in Berlin.
    # Cardmarket aktualisiert den Price Guide gegen 03 Uhr deutscher Zeit.
    - cron: "41 3 * * *"
  workflow_dispatch:

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Katalog und Price Guide übernehmen
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python -m cmtracker catalog --out out

      - name: Review-Datei bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: katalog-review-${{ github.run_number }}
          path: scraper/out/
          retention-days: 30
          if-no-files-found: ignore

      - name: Mail bei unerwartetem Fehler
        if: failure()
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: >-
          python cmtracker/alerts.py --skip-if-sent out
          --subject "Katalog-Workflow fehlgeschlagen"
          --body "Der Katalog-Workflow ist mit einem Fehler abgebrochen. Details im Protokoll des Laufs."
