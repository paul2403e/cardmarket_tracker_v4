name: Scrape (Angebote & Preise)

on:
  schedule:
    # 05:11 Uhr Berlin (Winterzeit) – schafft voraussichtlich den ganzen Tag.
    - cron: "11 4 * * *"
    # 11:11 und 17:11 Uhr: Fortsetzung, falls der erste Lauf nicht fertig wurde (sonst Ende nach ~1 Min.).
    - cron: "11 10 * * *"
    - cron: "11 16 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Höchstens so viele Produkte (leer = alle aktiven)"
        required: false
        default: "20"
      max_minutes:
        description: "Zeitbudget in Minuten (danach sauber aufhören, nächster Lauf macht weiter)"
        required: false
        default: "330"
      game:
        description: "Nur dieses Spiel (leer = alle), z. B. pokemon"
        required: false
        default: ""
      reset_today:
        description: "Heutige Scrape-Daten löschen und den Tag neu scrapen"
        type: boolean
        required: false
        default: false

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        env:
          LOG_LEVEL: info
          LOG_HTML: false
          CAPTCHA_SOLVER: none
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Auf FlareSolverr warten
        run: |
          for i in $(seq 1 60); do
            curl -s http://localhost:8191/ > /dev/null && echo "FlareSolverr bereit" && exit 0
            sleep 2
          done
          echo "FlareSolverr startet nicht" && exit 1

      - name: Scrapen
        env:
          CM_USERNAME: ${{ secrets.CM_USERNAME }}
          CM_PASSWORD: ${{ secrets.CM_PASSWORD }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          LIMIT: ${{ inputs.limit }}
          MAX_MINUTES: ${{ inputs.max_minutes }}
          GAME: ${{ inputs.game }}
          RESET_TODAY: ${{ inputs.reset_today }}
          FINAL_ATTEMPT: ${{ github.event.schedule == '11 16 * * *' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          HC_PING_URL: ${{ secrets.HC_PING_URL }}
        run: |
          ARGS="--max-minutes ${MAX_MINUTES:-330}"
          if [ -n "$LIMIT" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          if [ -n "$GAME" ]; then ARGS="$ARGS --game $GAME"; fi
          if [ "$RESET_TODAY" = "true" ]; then ARGS="$ARGS --reset-today"; fi
          if [ "$FINAL_ATTEMPT" = "true" ]; then ARGS="$ARGS --final-attempt"; fi
          python -m cmtracker scrape $ARGS --out out

      - name: Review-Datei bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-review-${{ github.run_number }}
          path: scraper/out/
          retention-days: 7
          if-no-files-found: ignore

      - name: Mail bei unerwartetem Fehler
        if: failure()
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: >-
          python cmtracker/alerts.py --skip-if-sent out
          --subject "Scrape-Workflow fehlgeschlagen"
          --body "Der Scrape-Workflow ist mit einem Fehler abgebrochen. Details im Protokoll des Laufs."
